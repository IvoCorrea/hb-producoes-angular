@if (item) {
  <!-- HERO com primeira imagem -->
  <div 
    class="relative h-screen bg-cover bg-center flex items-end"
    [style.background-image]="'url(' + item.imagem[0] + ')'"
  >
    <div class="absolute inset-0 bg-linear-to-t from-black via-black/60 to-transparent"></div>
    <div class="relative z-10 px-10 pb-20 max-w-4xl">
      <p class="uppercase tracking-[0.4em] text-red-500 text-sm mb-4">HB Produções</p>
      <h1 class="text-5xl md:text-7xl font-black mb-6">{{ item.titulo }}</h1>
    </div>
  </div>

  <!-- SPLIT: descrição + galeria -->
  <div class="bg-black text-white py-24 px-6">
    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-16">
      
      <!-- Coluna esquerda: descrição -->
      <div class="sticky top-32 self-start">
        <h2 class="text-2xl font-black mb-6 text-red-500 uppercase tracking-widest">Sobre</h2>
        <p class="text-zinc-300 text-lg leading-relaxed">{{ item.descricao }}</p>

        <a 
          routerLink="/" 
          class="cursor-pointer inline-block mt-12 border border-white/20 hover:bg-white/10 transition px-8 py-4 rounded-2xl font-bold"
        >
          ← Voltar ao início
        </a>
      </div>

      <!-- Coluna direita: galeria -->
      <div class="flex flex-col gap-6">
        @for (img of item.imagem.slice(1); track img) {
          <img 
            [src]="img" 
            class="rounded-3xl w-full object-cover hover:scale-105 transition duration-300"
          >
        }
      </div>

    </div>
  </div>

} @else {
  <div class="min-h-screen flex items-center justify-center">
    <p class="text-zinc-400 text-xl">Item não encontrado.</p>
  </div>
}
