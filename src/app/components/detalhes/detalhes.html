@if (item) {
  <div class="py-28 px-6 max-w-7xl mx-auto">
    <h1 class="text-5xl font-black mb-8">{{ item.titulo }}</h1>
    <p class="text-zinc-400 text-xl mb-12">{{ item.descricao }}</p>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      @for (img of item.imagem; track img) {
        <img [src]="img" class="rounded-3xl w-full h-96 object-cover">
      }
    </div>
  </div>
} @else {
  <p class="text-center py-28">Item não encontrado.</p>
}
